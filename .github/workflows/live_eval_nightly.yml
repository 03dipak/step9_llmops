name: Live Eval Nightly

on:
  schedule:
    # Runs every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  # NOTE: never a merge gate -- informational only (live judge env stays OUT of llm_eval_gate.yml).

jobs:
  nightly-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Nightly Live Evaluation (informational)
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          mkdir -p build/reports
          echo "[nightly] Starting live judge evaluations (Mod-4 integration pending)..."
          uv run python -m llmops.eval.run_suite \
            --goldens-dir eval/goldens \
            --docs-dir data/docs --output build/reports/nightly_report.json

      - name: Upload Nightly Eval Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report-${{ github.run_id }}
          path: build/reports/nightly_report.json
          retention-days: 30