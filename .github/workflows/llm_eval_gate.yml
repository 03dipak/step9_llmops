name: LLM Eval Gate (Offline)

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  eval-gate:
    name: Offline Evaluation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies
        run: uv sync

      - name: Run Deterministic Eval Suite
        run: |
          mkdir -p build/reports
          uv run python -m llmops.eval.run_suite \
            --goldens-dir eval/goldens \
            --docs-dir data/docs --output build/reports/candidate_report.json

      - name: Execute Regression Gate Comparison
        id: eval_compare
        continue-on-error: true
        run: |
          set +e
          uv run python -m llmops.eval.compare \
            --active \
            --candidate build/reports/candidate_report.json
          
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          exit $EXIT_CODE

      - name: Process D36 Verdict & Annotations
        run: |
          EXIT_CODE=${{ steps.eval_compare.outputs.exit_code }}

          case $EXIT_CODE in
            0)
              echo "::notice title=Eval Gate Passed::All gate and guardrail metrics meet baseline tolerances."
              exit 0
              ;;
            1)
              echo "::error title=Eval Gate Failed::One or more gate metrics regressed below tolerance!"
              exit 1
              ;;
            2)
              echo "::warning title=Guardrail Warning (Review Required)::Gate passed, but non-blocking guardrail metrics drifted. Review recommended."
              # Force step success (Green checkmark in PR) for exit code 2
              exit 0
              ;;
            3)
              echo "::error title=Eval Execution Error::Input dataset or golden files missing/malformed."
              exit 3
              ;;
            4)
              echo "::error title=Configuration Error::Active baseline pointer or snapshot structure invalid."
              exit 4
              ;;
            *)
              echo "::error title=Unknown Exit Code::Unexpected exit code encountered ($EXIT_CODE)."
              exit $EXIT_CODE
              ;;
          esac