[project]
name = "llmops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "03dipak", email = "03dip.vaidya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.2",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[project.scripts]
llmops = "llmops:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "mypy>=2.3.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src", "eval"]
asyncio_mode = "auto"

addopts = "-m 'not integration'"
markers = ["integration: real network/model roundtrip (run with -m integration)"]
